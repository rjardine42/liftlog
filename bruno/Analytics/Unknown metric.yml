info:
  name: Unknown metric
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/analytics/nonsense"

runtime:
  scripts:
    - type: tests
      code: |-
        test("the error names the metrics that do exist", function() {
          expect(res.body.available).to.include("e1rm");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  An unregistered key 404s and lists what is available, so a typo tells you the
  right name instead of returning an empty series.

  `?bucket=fortnight` gives a 400 for the same reason.
