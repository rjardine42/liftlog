info:
  name: Estimated 1RM for one lift
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/analytics/e1rm?exerciseId={{benchPressId}}&bucket=day&from={{batchDateA}}&to={{sessionDate}}"
  params:
    - name: exerciseId
      value: "{{benchPressId}}"
      type: query
    - name: bucket
      value: day
      type: query
    - name: from
      value: "{{batchDateA}}"
      type: query
    - name: to
      value: "{{sessionDate}}"
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        test("one point per day bench was trained", function() {
          expect(res.body.points).to.have.lengthOf(2);
          expect(res.body.points[0].bucket).to.equal(bru.getVar("batchDateB"));
          expect(res.body.points[1].bucket).to.equal(bru.getVar("sessionDate"));
        });

        test("progression from 228 to 234.33", function() {
          expect(res.body.points[0].value).to.be.closeTo(228, 0.01);      // 180 * (1 + 8/30)
          expect(res.body.points[1].value).to.be.closeTo(234.333, 0.01);  // 185 * (1 + 8/30)
        });

        test("the 95lb warmup did not count", function() {
          expect(res.body.points[1].sampleCount).to.equal(2);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **The chart you actually want:** one lift over time.

  Bench on the earlier day tops out at `180 x 8` = 228, and on the session date
  at `185 x 8` = 234.33 — the `195 x 6` set scores 234.0, slightly lower, which
  is the point of comparing estimated maxes rather than raw top weight.

  `sampleCount: 2` on the last point confirms the 95lb warmup was excluded.
