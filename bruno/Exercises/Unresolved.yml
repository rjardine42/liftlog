info:
  name: Unresolved
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/exercises/unresolved"

runtime:
  scripts:
    - type: after-response
      code: |-
        const mystery = res.body.find(e => e.canonicalName === "Mystery Lift " + bru.getVar("runId"));

        if (mystery) {
          bru.setVar("unresolvedExerciseId", mystery.id);
        }
    - type: tests
      code: |-
        test("the unknown lift from the batch import is waiting here", function() {
          const mystery = res.body.find(e => e.canonicalName === "Mystery Lift " + bru.getVar("runId"));
          expect(mystery, "unresolved entry").to.not.be.undefined;
          expect(mystery.timesLogged).to.equal(1);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **The backlog to work through.** Anything an import could not match lands
  here with its data intact.

  Two ways out, depending on what the name is:

  - It is a real lift the catalogue already has under another name → **merge**
    it (next requests), which also fixes the rows already stored.
  - It is a genuinely new movement → leave it. It works fine as its own
    exercise; clearing the flag is just tidiness.
