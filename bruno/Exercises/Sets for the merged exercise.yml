info:
  name: Sets for the merged exercise
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/sets?exerciseId={{barbellRowId}}&from={{batchDateA}}&to={{sessionDate}}"
  params:
    - name: exerciseId
      value: "{{barbellRowId}}"
      type: query
    - name: from
      value: "{{batchDateA}}"
      type: query
    - name: to
      value: "{{sessionDate}}"
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        test("the set logged under the old name now belongs to Barbell Row", function() {
          expect(res.body).to.have.lengthOf(1);
          expect(res.body[0].exercise).to.equal("Barbell Row");
          expect(res.body[0].reps).to.equal(8);
          expect(res.body[0].weight).to.equal(135);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Proof that merging fixed the **existing** data, not just future imports: the
  `8 x 135` set was logged as "Mystery Lift" and now reads as Barbell Row.

  This is why merge exists alongside aliases — an alias alone would have left
  this set stranded under a name you no longer use.
